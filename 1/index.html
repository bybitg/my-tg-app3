<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>MR RAGNAR — Your Crypto Portfolio</title>
  <link rel="stylesheet" href="code/style.css">
</head>
<body>
  <main class="screen" aria-label="MR RAGNAR crypto portfolio dashboard">
    <img class="dashboard" src="photo/dashboard.jpg" alt="MR RAGNAR — криптопортфель: боковое меню, баланс, график роста депозита, транзакции и список монет">
    <nav class="hotspots" aria-label="Навигация по макету">
      <button class="hotspot home" aria-label="Главная" data-note="Главная"></button>
      <button class="hotspot wallet" aria-label="Кошелёк" data-note="Кошелёк"></button>
      <button class="hotspot analytics" aria-label="Аналитика" data-note="Аналитика"></button>
      <button class="hotspot transactions" aria-label="Транзакции" data-note="Транзакции"></button>
      <button class="hotspot staking" aria-label="Стейкинг" data-note="Стейкинг"></button>
      <button class="hotspot settings" aria-label="Настройки" data-note="Настройки"></button>
      <button class="hotspot profile" aria-label="Профиль" data-note="Профиль"></button>
      <button class="hotspot logout" aria-label="Выход" data-note="Это демонстрационный макет. Авторизация не подключена."></button>
    </nav>
    <div class="notice" role="status" aria-live="polite"></div>
  </main>
  <script src="code/script.js"></script>
</body>
</html>
